[project]
name = "rideforecast"
version = "0.1.0"
description = "Short-term spatiotemporal demand forecasting on Chicago rideshare trip data"
readme = "README.md"
authors = [
    { name = "als-217", email = "alexstratton2121@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
rideforecast = "rideforecast.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "UP",  # pyupgrade: modernize syntax for your Python version
    "B",   # bugbear: common bug patterns
    "SIM", # simplifications
    "C4",  # cleaner comprehensions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
